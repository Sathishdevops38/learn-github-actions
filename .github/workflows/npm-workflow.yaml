name: node and npm versions
on:
  # push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-using-actions/react-app 
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: install dependencies
        run: npm ci
      - name: tests
        run: npm run test 
        